name: Daily DSA Notifier

on:
  schedule:
    # Runs everyday at 02:30 UTC (8:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab anytime!

jobs:
  daily-dsa-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit sent history back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily DSA Problem Job
        env:
          CF_HANDLE: ${{ secrets.CF_HANDLE || 'HIMANSHU_KUMAR0' }}
          MIN_RATING: ${{ secrets.MIN_RATING || '800' }}
          MAX_RATING: ${{ secrets.MAX_RATING || '1200' }}
          PREFERRED_TAGS: ${{ secrets.PREFERRED_TAGS }}
          NOTIFICATION_CHANNEL: ${{ secrets.NOTIFICATION_CHANNEL || 'ntfy' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'himanshu-cf-daily-8789' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          USE_TWILIO: ${{ secrets.USE_TWILIO }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: |
          python main.py

      - name: Commit and push sent history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history/sent_problems.json
          if git diff --staged --quiet; then
            echo "No new history updates to commit."
          else
            git commit -m "Auto: Update daily DSA problem history [skip ci]"
            git push
          fi
